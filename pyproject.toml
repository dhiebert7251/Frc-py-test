[tool.robotpy]
# 2027-alpha tracking only -- READ README.md before assuming this project
# does anything useful. This is not a continuation of the working port on
# claude/frc-java-robotpy-port-i012ns.
#
# a7 is the newest alpha as of this check. This project's dev environment
# could only actually install and test a6 -- a7's native wheels weren't
# published yet for that platform. If `robotpy sync` can't find a7 wheels
# for your platform, drop back to 2027.0.0a6.
robotpy_version = "2027.0.0a7"

# Deliberately no `components` and no vendor `requires` here: commands2
# (robotpy-commands-v2), REVLib, navX, PathPlanner, PhotonVision, and
# Phoenix 6 all have no 2027 release yet. See README.md.

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"
